name: release

# publishes the version written by `npm run release:pr` once its Release PR is squash-merged into main
on:
  push:
    branches:
      - main
  workflow_call:
    secrets:
      NPM_AUTH_TOKEN:
        required: false

jobs:
  release:
    if: "startsWith(github.event.head_commit.message, 'chore(release): publish v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          install: false
      # NOTE: pnpm/setup writes no registry auth, so this recreates the user .npmrc whose token publish supplies through NODE_AUTH_TOKEN; trusted publishing (OIDC) takes precedence, and the token only covers a package's first publish
      - name: configure npm registry auth
        shell: bash
        run: |
          npmrc="$RUNNER_TEMP/.npmrc"
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' 'registry=https://registry.npmjs.org/' > "$npmrc"
          echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"
          echo "NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX" >> "$GITHUB_ENV"
      - name: install dependencies
        run: pnpm install
      - name: run build
        run: pnpm run build
      - name: run test
        run: pnpm run test
        env:
          CI: true
      - name: tag, publish and write the release note
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN || 'XXXXX-XXXXX-XXXXX-XXXXX' }}
        run: |
          set -euo pipefail

          # the squash title is the Release PR title plus " (#123)"
          V=$(git log -1 --format=%s | sed -e 's/^chore(release): publish v//' -e 's/ (#[0-9]*)$//')

          # publish only what was reviewed: the merged tree must equal the Release PR head
          H=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha // empty')
          [ -n "$H" ] || { echo "::error::v$V was not merged from a pull request; run npm run release:pr"; exit 1; }
          git fetch -q origin "$H"
          [ "$(git rev-parse "$H^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ] ||
            { echo "::error::main moved after the Release PR was prepared; revert this commit, run npm run release:pr and merge again"; exit 1; }

          # every step below skips itself when already done, so a failed run can simply be rerun
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            git fetch -q origin "refs/tags/v$V:refs/tags/v$V"
          else
            git tag "v$V"
            git push -q origin "v$V"
          fi

          # a prerelease goes to its phase's dist-tag (10.0.0-alpha.0 → alpha) so `latest` stays on the last stable
          case "$V" in
            *-*) DIST=${V#*-}; DIST=${DIST%%.*}; DIST=${DIST%%-*}; case "$DIST" in '' | [0-9]*) DIST=next ;; esac ;;
            *) DIST=latest ;;
          esac
          pnpm publish -r --no-git-checks --access public --provenance --tag "$DIST"

          gh release view "v$V" >/dev/null 2>&1 || pnpm dlx github-release-from-changelog
          case "$V" in *-*) gh release edit "v$V" --prerelease ;; esac

          # a stable release ends the cycle: drop the dated preview builds up to this version, keeping their tags
          if [ "$DIST" = latest ]; then
            gh release list --limit 1000 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
              { grep -E -- '-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,}$' || true; } |
              while read -r tag; do
                core=${tag#v}
                core=${core%%-*}
                if [ "$(printf '%s\n' "$core" "$V" | sort -V | tail -1)" = "$V" ]; then
                  gh release delete "$tag" --yes
                fi
              done
          fi

          git push -q origin --delete releases/next 2>/dev/null || true
