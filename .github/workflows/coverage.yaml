name: code coverage

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          install: false
      - name: install dependencies
        run: pnpm install
      - name: run coverage
        run: pnpm run test:coverage
        env:
          CI: true
      - name: upload coverage
        uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{secrets.QLTY_COVERAGE_TOKEN}}
          files: coverage/lcov.info
