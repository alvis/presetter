name: Code Coverage

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main

# the jobs only read the repository; the coverage upload authenticates with its own token
permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
        with:
          # later steps run repository scripts, which must not be able to read the checkout token
          persist-credentials: false
      - name: Quality
        # neither event is pull_request, so the unit suite always runs in full
        uses: ./.github/actions/quality
        with:
          checkout: false
          typecheck-script: null
          lint-test-script: null
      - name: Coverage Upload
        uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info
