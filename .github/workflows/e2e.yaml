name: e2e

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: ["lts/*", "latest"]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/action-setup@v4
      - name: use node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: setup bun
        uses: oven-sh/setup-bun@v2
      - name: install dependencies
        run: pnpm install
      # NOTE: one shared browser path outranks pnpm's isolated XDG cache, so browser tests skip the download inside their script timeout
      - name: install playwright chromium
        run: npx --yes playwright@latest install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - name: run e2e tests
        run: pnpm run test:e2e
        timeout-minutes: 45
        env:
          CI: true
          DEBUG: ${{ vars.DEBUG }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
