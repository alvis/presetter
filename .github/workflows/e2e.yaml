name: e2e

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [lts]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      # NOTE: pnpm's node runtime bundles no npm, so pin a current npm for the suite's npx-driven npm and corepack runs instead of relying on the runner image's copy
      - name: install npm
        run: pnpm add --global npm
      - name: setup bun
        uses: oven-sh/setup-bun@v2
      - name: install dependencies
        run: pnpm install
      # NOTE: one shared browser path outranks pnpm's isolated XDG cache, so browser tests skip the download inside their script timeout
      - name: install playwright chromium
        run: pnpm dlx playwright@latest install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      - name: run e2e tests
        run: pnpm run test:e2e
        timeout-minutes: 45
        env:
          CI: true
          DEBUG: ${{ vars.DEBUG }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
