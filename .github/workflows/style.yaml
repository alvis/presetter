name: code style

on:
  push:
    branches:
      - '**'
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          install: false
      - name: install dependencies
        run: pnpm install
      - name: run code style check
        run: pnpm run lint
        env:
          CI: true
