name: code test

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [lts]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - name: install dependencies
        run: pnpm install
      - name: run test
        run: pnpm run test
        env:
          CI: true
      - name: run build
        run: pnpm run build
