name: Code Test

on:
  push:
    branches:
      - '**'

# the jobs only read the repository
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [lts]
    steps:
      # a local action must be checked out first; it then runs this commit's own copy
      - name: Code Checkout
        uses: actions/checkout@v7
        with:
          # later steps run repository scripts, which must not be able to read the checkout token
          persist-credentials: false
      - name: Quality
        uses: ./.github/actions/quality
        with:
          checkout: false
          node-version: ${{ matrix.node }}
          # coverage and lint have their own workflows, so each leg only type checks and tests
          coverage-test-by: null
          lint-test-script: null
      - name: Build
        run: pnpm run build
